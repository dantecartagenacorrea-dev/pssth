# Genera el APK de Lector para instalar en un Android (sin Google Play).
# Se ejecuta a mano: pestaña Actions > "Android APK" > Run workflow.
# El APK queda en la seccion "Artifacts" de la ejecucion.
name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Misma versión que en el PC: una más nueva trae reglas del analizador
          # que aquí no se ven y la compilación falla.
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: lector-android
          path: build/app/outputs/flutter-apk/app-release.apk
      # APKs por arquitectura (mas chicos): arm64-v8a (64 bits), armeabi-v7a (32 bits), x86_64 (emulador).
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pssth-por-arquitectura
          path: build/app/outputs/flutter-apk/app-*-release.apk
