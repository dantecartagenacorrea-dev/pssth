# Genera el APK de Lector para instalar en un Android (sin Google Play).
# Se ejecuta a mano: pestaña Actions > "Android APK" > Run workflow.
# El APK queda en la seccion "Artifacts" de la ejecucion.
name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: lector-android
          path: build/app/outputs/flutter-apk/app-release.apk
